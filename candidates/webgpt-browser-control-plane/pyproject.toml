[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webgpt-browser-control-plane"
version = "0.3.0a1"
description = "Policy, approval, durable-job, and evidence core for bounded browser control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary candidate; no production grant" }
authors = [{ name = "Kyuha927 project" }]
dependencies = ["jsonschema==4.26.0", "cryptography==46.0.4"]

[project.optional-dependencies]
# Playwright remains the deterministic primary browser worker for known flows.
playwright = ["playwright==1.62.0"]
http = ["starlette==0.50.0", "uvicorn==0.48.0"]
test = ["httpx==0.28.1"]
# Jev itself is deliberately installed only from ENGINE_SOURCES.lock.json into
# a separate Python >=3.12 environment.  This extra supplies only the exact
# harness dependency; it never turns on Jev or external model egress.
jev = ["browser-harness==0.1.13"]

[project.scripts]
wbcp = "wbcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
