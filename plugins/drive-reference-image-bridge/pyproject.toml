[project]
name = "drive-reference-image-bridge-validation"
version = "0.1.0"
description = "Validation utilities for the Drive Reference Image Bridge ChatGPT plugin"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
