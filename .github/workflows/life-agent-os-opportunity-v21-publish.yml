name: Publish Life Agent OS v2.1 Opportunity

on:
  push:
    branches: [life-agent-os-opportunity-v21-final-20260911]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: life-agent-os-opportunity-v21-final-20260911
          fetch-depth: 1

      - name: Wait for verified chunked build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            row=$(gh run list \
              --workflow life-agent-os-opportunity-v21-chunked.yml \
              --branch life-agent-os-opportunity-v21-final-20260911 \
              --commit "$TARGET_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] | [.databaseId,.status,.conclusion] | @tsv' 2>/dev/null || true)
            if [ -n "$row" ]; then
              IFS=$'\t' read -r run_id status conclusion <<< "$row"
              echo "chunked run=$run_id status=$status conclusion=$conclusion"
              if [ "$status" = completed ] && [ "$conclusion" = success ]; then
                echo "$run_id" > /tmp/chunked-run-id
                exit 0
              fi
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                echo "Verified chunked build failed: $conclusion" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for verified chunked build' >&2
          exit 1

      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(cat /tmp/chunked-run-id)
          rm -rf /tmp/opportunity-artifact
          mkdir -p /tmp/opportunity-artifact
          gh run download "$run_id" \
            --name life-agent-os-v2.1-opportunity-alpha-chunked \
            --dir /tmp/opportunity-artifact
          test -s /tmp/opportunity-artifact/Life-Agent-OS-v2.1-opportunity-alpha.apk
          test -s /tmp/opportunity-artifact/Life-Agent-OS-v2.1-opportunity-alpha.apk.sha256
          test -s /tmp/opportunity-artifact/OPPORTUNITY_BUILD_REPORT.txt
          test -s /tmp/opportunity-artifact/home.png
          test -s /tmp/opportunity-artifact/opportunity.png
          (cd /tmp/opportunity-artifact && sha256sum -c Life-Agent-OS-v2.1-opportunity-alpha.apk.sha256)

      - name: Publish verified files to branch
        shell: bash
        run: |
          set -euo pipefail
          DEST=dist/life-agent-os-v2.1-opportunity
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/opportunity-artifact/Life-Agent-OS-v2.1-opportunity-alpha.apk "$DEST/"
          cp /tmp/opportunity-artifact/Life-Agent-OS-v2.1-opportunity-alpha.apk.sha256 "$DEST/"
          cp /tmp/opportunity-artifact/OPPORTUNITY_BUILD_REPORT.txt "$DEST/"
          cp /tmp/opportunity-artifact/home.png "$DEST/"
          cp /tmp/opportunity-artifact/opportunity.png "$DEST/"
          cp /tmp/opportunity-artifact/home-uiautomator.xml "$DEST/"
          cp /tmp/opportunity-artifact/opportunity-uiautomator.xml "$DEST/"
          cp /tmp/opportunity-artifact/runtime-crash-scan.txt "$DEST/"
          cp /tmp/opportunity-artifact/apk-badging.txt "$DEST/"
          cp /tmp/opportunity-artifact/apk-permissions.txt "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'build(agent-os): publish verified v2.1 Opportunity APK [skip ci]'
          git push origin HEAD:life-agent-os-opportunity-v21-final-20260911
