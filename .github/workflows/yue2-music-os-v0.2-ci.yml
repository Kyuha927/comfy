name: Verify YuE2 Music OS v0.2 Alpha

on:
  push:
    branches:
      - yue2-music-os-composition-router-v0.2-alpha-20260915
    paths:
      - "releases/yue2-music-os/v0.2-alpha/**"
      - ".github/workflows/yue2-music-os-v0.2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yue2-music-os-v0.2-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1789430400"

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: releases/yue2-music-os/v0.2-alpha
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install verification toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip check

      - name: Verify committed source checksums
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt

      - name: Compile and syntax checks
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          node --check src/yue2_music_os/static/app.js
          bash -n scripts/*.sh

      - name: Test with branch coverage gate
        run: |
          set -euo pipefail
          mkdir -p validation
          pytest \
            --cov=yue2_music_os \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:validation/ci-coverage.json \
            --cov-fail-under=75 \
            --junitxml=validation/ci-junit.xml

      - name: HTTP production-router smoke
        run: |
          set -euo pipefail
          ./scripts/smoke.sh | tee validation/ci-smoke.txt

      - name: Enforce evidence and commercial-safety boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("RELEASE_STATUS.json").read_text(encoding="utf-8"))
          assert status["version"] == "0.2.0a1"
          assert status["verified_here"]["tests"]["passed"] == 48
          assert status["implemented"]["candidate_ranking"]["quality_claim"] is False
          assert status["implemented"]["commercial_safety"]["source_audio_copied_to_provider_packages"] is False
          assert status["explicitly_not_verified"]["real_yue2_gpu_inference"] == "NOT_RUN"
          assert status["explicitly_not_verified"]["live_flow_lyria_call"] == "NOT_RUN"
          print("EVIDENCE BOUNDARY PASS")
          PY

      - name: Build and compare deterministic wheels
        run: |
          set -euo pipefail
          rm -rf /tmp/yue2-wheel-a /tmp/yue2-wheel-b build src/*.egg-info
          mkdir -p /tmp/yue2-wheel-a /tmp/yue2-wheel-b
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/yue2-wheel-a
          rm -rf build src/*.egg-info
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/yue2-wheel-b
          wheel_a="$(find /tmp/yue2-wheel-a -maxdepth 1 -name 'yue2_music_os-0.2.0a1-*.whl' -print -quit)"
          wheel_b="$(find /tmp/yue2-wheel-b -maxdepth 1 -name 'yue2_music_os-0.2.0a1-*.whl' -print -quit)"
          test -n "$wheel_a"
          test -n "$wheel_b"
          cmp "$wheel_a" "$wheel_b"
          WHEEL_PATH="$wheel_a" python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["WHEEL_PATH"])
          with zipfile.ZipFile(wheel) as package:
              members = set(package.namelist())
          required = {
              "yue2_music_os/production.py",
              "yue2_music_os/static/app.js",
              "yue2_music_os/static/index.html",
              "yue2_music_os/static/styles.css",
          }
          missing = sorted(required - members)
          if missing:
              raise SystemExit("wheel missing required members: " + ", ".join(missing))
          print("DETERMINISTIC WHEEL PASS")
          print("sha256=" + hashlib.sha256(wheel.read_bytes()).hexdigest())
          print("members=" + str(len(members)))
          PY
