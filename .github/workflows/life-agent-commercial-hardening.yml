name: Build and Audit Life Agent Commercial Hardening

on:
  push:
    branches:
      - life-agent-commercial-hardening-v3-2-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated hardening branch
        uses: actions/checkout@v4
        with:
          ref: life-agent-commercial-hardening-v3-2-20260911
          fetch-depth: 1

      - name: Restore verified Agent OS source and apply hardening overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/life-agent-os-v2-source.tar.gz
          rm -rf /tmp/life-agent-commercial-src
          mkdir -p /tmp/life-agent-commercial-src
          tar -xzf release-assets/life-agent-os-v2-source.tar.gz -C /tmp/life-agent-commercial-src
          PROJECT_ROOT="$(find /tmp/life-agent-commercial-src -maxdepth 4 -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          bash commercial-hardening/apply-commercial-hardening.sh "$PROJECT_ROOT"
          bash commercial-hardening/apply-commercial-followup.sh "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          find "$PROJECT_ROOT/app/src/main/java/com/lifeagent/unified" -maxdepth 1 -name 'Commercial*.java' -o -name 'SafeAutofillService.java' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build and emulator components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static security and product contract audit
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          CORE="$PROJECT_ROOT/app/src/main/java/com/lifeagent/unified/CommercialCore.java"
          python3 - "$MANIFEST" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY
          grep -q "versionCode 320" "$PROJECT_ROOT/app/build.gradle"
          grep -q "versionName '3.2.0-hardening-beta'" "$PROJECT_ROOT/app/build.gradle"
          grep -q 'CommercialMainActivity' "$MANIFEST"
          grep -q 'CommercialNotificationListener' "$MANIFEST"
          grep -q 'CommercialLocationService' "$MANIFEST"
          grep -q 'SafeAutofillService' "$MANIFEST"
          grep -q 'net.ib.android.smcard' "$CORE"
          grep -q 'MISSING_VERIFIED_EVIDENCE' "$CORE"
          grep -q 'encrypted_state_unreadable' "$CORE"
          grep -q 'commercialRecommendations = json.optBoolean("commercialRecommendations", false)' "$CORE"
          grep -q 'notificationAnalysis = json.optBoolean("notificationAnalysis", false)' "$CORE"
          grep -q 'nearbyOpportunities = json.optBoolean("nearbyOpportunities", false)' "$CORE"
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          ! grep -q 'android.permission.READ_SMS' "$MANIFEST"
          ! grep -q 'android.permission.RECEIVE_SMS' "$MANIFEST"
          ! grep -q 'android.permission.READ_CONTACTS' "$MANIFEST"
          ! grep -q 'android.permission.READ_CALL_LOG' "$MANIFEST"
          ! grep -q 'android.permission.CALL_PHONE' "$MANIFEST"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$MANIFEST"
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -R -E '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,})' \
              "$PROJECT_ROOT/app/src" --exclude='*.md'

      - name: Compile, unit test, lint and assemble
        id: gradle
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace \
            :app:clean \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease 2>&1 | tee /tmp/commercial-gradle.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture compile or lint failure
        if: steps.gradle.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p failure
          {
            echo 'LIFE_AGENT_COMMERCIAL_BUILD_FAILURE'
            echo "commit=$GITHUB_SHA"
            echo
            grep -n -E '(error:|FAILURE:|What went wrong|Execution failed|cannot find symbol|incompatible types|Lint found)' \
              /tmp/commercial-gradle.log || true
            echo
            tail -n 320 /tmp/commercial-gradle.log
          } > failure/BUILD_FAILURE.log

      - name: Upload build failure diagnostics
        if: steps.gradle.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: life-agent-commercial-build-failure
          path: failure/BUILD_FAILURE.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on compile or lint failure
        if: steps.gradle.outputs.status != '0'
        run: exit 1

      - name: Create Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force \
            --name life-agent-commercial \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd life-agent-commercial \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              break
            fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install APK and run debug contract suites
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist runtime-evidence
          adb install -r "$APK"
          adb logcat -c

          adb shell am start -W -n com.lifeagent.unified/.CommercialSelfTestActivity > runtime-evidence/self-test-start.txt
          sleep 2
          adb exec-out run-as com.lifeagent.unified cat files/commercial-self-test.json \
            > runtime-evidence/commercial-self-test.json
          grep -Eq '"final"[[:space:]]*:[[:space:]]*"PASS"' runtime-evidence/commercial-self-test.json

          adb shell am start -W -n com.lifeagent.unified/.CommercialStateSelfTestActivity \
            > runtime-evidence/state-test-start.txt
          sleep 2
          adb exec-out run-as com.lifeagent.unified cat files/commercial-state-self-test.json \
            > runtime-evidence/commercial-state-self-test.json
          grep -Eq '"final"[[:space:]]*:[[:space:]]*"PASS"' runtime-evidence/commercial-state-self-test.json

      - name: Goal-first UI, rotation, process recovery and entry smoke
        shell: bash
        run: |
          set -euo pipefail

          dump_ui() {
            local name="$1"
            for attempt in 1 2 3; do
              adb shell uiautomator dump "/sdcard/${name}.xml" >/dev/null 2>&1 && break
              sleep 1
            done
            adb pull "/sdcard/${name}.xml" "runtime-evidence/${name}.xml" >/dev/null
          }

          tap_contains() {
            local xml="$1"
            local needle="$2"
            python3 - "$xml" "$needle" <<'PY'
          import re, subprocess, sys, xml.etree.ElementTree as ET
          path, needle = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          candidates=[]
          for node in root.iter('node'):
              text=(node.attrib.get('text','')+' '+node.attrib.get('content-desc','')).strip()
              if needle in text:
                  match=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                  if match:
                      x1,y1,x2,y2=map(int,match.groups())
                      candidates.append(((x2-x1)*(y2-y1),(x1+x2)//2,(y1+y2)//2,text))
          if not candidates:
              raise SystemExit('UI text not found: '+needle)
          _,x,y,_=sorted(candidates)[0]
          subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
          PY
          }

          adb shell am force-stop com.lifeagent.unified
          adb shell am start -W -n com.lifeagent.unified/.CommercialMainActivity \
            > runtime-evidence/home-start.txt
          sleep 2
          dump_ui home
          grep -q '원하는 결과만 말하세요' runtime-evidence/home.xml
          grep -q '처리 계획 보기' runtime-evidence/home.xml
          grep -q '상용화 준비 상태' runtime-evidence/home.xml
          adb exec-out screencap -p > runtime-evidence/home.png

          adb shell am start -W -n com.lifeagent.unified/.CommercialMainActivity \
            --es lifeagent.os.command '금요일 오후 정형외과 예약해줘' \
            > runtime-evidence/command-start.txt
          sleep 2
          dump_ui command
          grep -q '금요일 오후 정형외과 예약해줘' runtime-evidence/command.xml
          tap_contains runtime-evidence/command.xml '처리 계획 보기'
          sleep 1
          dump_ui plan
          grep -q '예약 대행' runtime-evidence/plan.xml
          grep -q '실행 계획' runtime-evidence/plan.xml
          grep -q '일부 연결됨' runtime-evidence/plan.xml
          adb exec-out screencap -p > runtime-evidence/plan.png
          adb shell input keyevent 4

          adb shell am start -W -a android.intent.action.SEND -t text/plain \
            --es android.intent.extra.TEXT '진료비 영수증 보험금 청구해줘' \
            -n com.lifeagent.unified/.CommercialMainActivity \
            > runtime-evidence/share-start.txt
          sleep 2
          dump_ui share
          grep -q '진료비 영수증 보험금 청구해줘' runtime-evidence/share.xml
          adb exec-out screencap -p > runtime-evidence/share.png

          adb shell am force-stop com.lifeagent.unified
          adb shell am start -W -n com.lifeagent.unified/.CommercialMainActivity \
            > runtime-evidence/recovery-start.txt
          sleep 1
          dump_ui recovered
          tap_contains runtime-evidence/recovered.xml '작업함'
          sleep 1
          dump_ui tasks
          grep -q '작업함' runtime-evidence/tasks.xml
          grep -q '엄마에게 5만원 송금' runtime-evidence/tasks.xml
          adb exec-out screencap -p > runtime-evidence/tasks.png

          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb shell am force-stop com.lifeagent.unified
          adb shell am start -W -n com.lifeagent.unified/.CommercialMainActivity >/dev/null
          sleep 1
          dump_ui landscape
          grep -q 'LIFE AGENT' runtime-evidence/landscape.xml
          adb exec-out screencap -p > runtime-evidence/landscape.png

          adb shell settings put system font_scale 1.3
          adb shell settings put system user_rotation 0
          adb shell am force-stop com.lifeagent.unified
          adb shell am start -W -n com.lifeagent.unified/.CommercialMainActivity >/dev/null
          sleep 1
          dump_ui large-font
          grep -q '원하는 결과만 말하세요' runtime-evidence/large-font.xml
          adb exec-out screencap -p > runtime-evidence/large-font.png
          adb shell settings put system font_scale 1.0

      - name: Smoke every skill surface and OS service
        shell: bash
        run: |
          set -euo pipefail
          for activity in \
            ReservationActivity \
            InsuranceActivity \
            TransferActivity \
            SignupActivity \
            StreamRulesActivity \
            VaultActivity \
            ConnectionsActivity \
            GeneralTaskActivity \
            CommercialUpdateActivity; do
            adb shell am start -W -n "com.lifeagent.unified/.${activity}" \
              --es lifeagent.os.command '상용화 스모크 테스트' \
              > "runtime-evidence/${activity}.txt"
            sleep 1
            adb shell pidof com.lifeagent.unified >/dev/null
          done

          adb shell pm grant com.lifeagent.unified android.permission.ACCESS_COARSE_LOCATION
          adb shell am start-foreground-service \
            -a com.lifeagent.unified.action.START_LOCATION_SESSION \
            -n com.lifeagent.unified/.CommercialLocationService \
            > runtime-evidence/location-service-start.txt
          sleep 2
          adb emu geo fix 126.9780 37.5665 >/dev/null
          sleep 2
          adb shell dumpsys activity services com.lifeagent.unified \
            > runtime-evidence/location-services.txt
          grep -q 'CommercialLocationService' runtime-evidence/location-services.txt
          adb shell am startservice \
            -a com.lifeagent.unified.action.STOP_LOCATION_SESSION \
            -n com.lifeagent.unified/.CommercialLocationService >/dev/null || true

          adb shell settings put secure enabled_notification_listeners \
            com.lifeagent.unified/.CommercialNotificationListener
          adb shell settings put secure autofill_service \
            com.lifeagent.unified/.SafeAutofillService
          sleep 1
          adb shell dumpsys notification > runtime-evidence/notification-dumpsys.txt
          adb shell dumpsys autofill > runtime-evidence/autofill-dumpsys.txt
          grep -q 'CommercialNotificationListener' runtime-evidence/notification-dumpsys.txt
          grep -q 'SafeAutofillService' runtime-evidence/autofill-dumpsys.txt

      - name: Runtime crash, privacy and package audit
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -d -v threadtime > runtime-evidence/logcat.txt
          python3 - runtime-evidence/logcat.txt <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          chunks=text.split('FATAL EXCEPTION')
          bad=[]
          for chunk in chunks[1:]:
              head=chunk[:2500]
              if 'com.lifeagent.unified' in head:
                  bad.append(head)
          if bad:
              print('\n---\n'.join(bad))
              raise SystemExit('FATAL_EXCEPTION_DETECTED')
          PY
          adb shell pidof com.lifeagent.unified > runtime-evidence/final-pid.txt
          test -s runtime-evidence/final-pid.txt

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" \
            > runtime-evidence/apk-permissions.txt
          for forbidden in \
            ACCESS_BACKGROUND_LOCATION READ_SMS RECEIVE_SMS READ_CONTACTS READ_CALL_LOG \
            CALL_PHONE QUERY_ALL_PACKAGES SYSTEM_ALERT_WINDOW MANAGE_EXTERNAL_STORAGE; do
            ! grep -q "$forbidden" runtime-evidence/apk-permissions.txt
          done
          adb shell run-as com.lifeagent.unified sh -c \
            'grep -R -a -E "비타민|provider-test-receipt|123456|654321" shared_prefs files 2>/dev/null' \
            > runtime-evidence/plaintext-scan.txt || true
          test ! -s runtime-evidence/plaintext-scan.txt

      - name: Verify APK signature, alignment, contents and release shape
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          cp "$DEBUG_APK" dist/Life-Agent-OS-v3.2-hardening-beta.apk
          cp "$RELEASE_APK" dist/Life-Agent-OS-v3.2-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 \
            dist/Life-Agent-OS-v3.2-hardening-beta.apk > dist/zipalign.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/Life-Agent-OS-v3.2-hardening-beta.apk > dist/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/Life-Agent-OS-v3.2-hardening-beta.apk > dist/apk-badging.txt
          grep -q "package: name='com.lifeagent.unified'" dist/apk-badging.txt
          grep -q "versionCode='320'" dist/apk-badging.txt
          grep -q "versionName='3.2.0-hardening-beta'" dist/apk-badging.txt
          unzip -t dist/Life-Agent-OS-v3.2-hardening-beta.apk > dist/unzip-test.txt
          sha256sum dist/Life-Agent-OS-v3.2-hardening-beta.apk \
            > dist/Life-Agent-OS-v3.2-hardening-beta.apk.sha256
          sha256sum dist/Life-Agent-OS-v3.2-release-unsigned.apk \
            > dist/Life-Agent-OS-v3.2-release-unsigned.apk.sha256
          cp "$PROJECT_ROOT/app/build/reports/lint-results-debug.html" dist/lint-results-debug.html
          cp "$PROJECT_ROOT/app/build/reports/lint-results-debug.xml" dist/lint-results-debug.xml

      - name: Create commercialization audit report
        shell: bash
        run: |
          set -euo pipefail
          SELF_TESTS="$(python3 -c 'import json; d=json.load(open("runtime-evidence/commercial-self-test.json")); print(d["tests"])')"
          STATE_TESTS="$(python3 -c 'import json; d=json.load(open("runtime-evidence/commercial-state-self-test.json")); print(d["tests"])')"
          HASH="$(cut -d' ' -f1 dist/Life-Agent-OS-v3.2-hardening-beta.apk.sha256)"
          cat > dist/COMMERCIALIZATION_AUDIT.md <<EOF
          # Life Agent OS v3.2 Hardening Beta Audit

          ## Verdict

          **Core hardening beta: PASS**

          **All live external services error-free: NOT VERIFIED**

          The installable APK compiled, linted, installed and survived Android 15 runtime smoke. External services that require a bank, insurer, telephony provider, AI subscription client or PC Companion remain fail-closed until formally connected and tested with authorized accounts.

          ## Verified

          - Debug contract tests: ${SELF_TESTS} PASS
          - Encrypted state and recovery integration tests: ${STATE_TESTS} PASS
          - Android Lint: PASS
          - Android 15 install and launch: PASS
          - Goal-first home and plan preview: PASS
          - Share entry and task recovery after force-stop: PASS
          - Landscape and 1.3x font scale smoke: PASS
          - All declared skill activities launch without fatal exception: PASS
          - Foreground-only coarse location service: PASS
          - Notification listener and safe autofill service registration: PASS
          - Forbidden permission audit: PASS
          - Plaintext sensitive test marker scan: PASS
          - APK alignment, signature and ZIP integrity: PASS

          ## Fail-closed external boundaries

          - Real bank transfer: provider contract and live receipt verification required
          - Real Monimo claim submission: authorized physical-device end-to-end test required
          - AI phone reservation: telephony provider or Companion required
          - AI subscription execution: official client executor required
          - SOOP/CHZZK zero-tap launch: physical-device vendor background policy test required
          - Benefits auto-application: official eligibility and submission data provider required
          - Nearby merchant inventory, hours and price ranking: licensed places provider required

          ## Build identity

          - Package: com.lifeagent.unified
          - Version: 3.2.0-hardening-beta
          - Version code: 320
          - SHA-256: ${HASH}
          - Signing: Android debug signing for device testing
          - Production signing: not included; release APK is intentionally unsigned
          EOF

          cat > dist/INSTALL_AND_TEST.md <<'EOF'
          # Install and first test

          1. Remove or disable notification access for older Life Agent test apps.
          2. Install `Life-Agent-OS-v3.2-hardening-beta.apk`.
          3. Set a device screen lock before testing transfer drafts or data deletion.
          4. Open **내 정보** and store only non-secret profile fields.
          5. Open **자동화**, select only the apps whose new notifications may be analyzed, then grant Android notification access.
          6. Start nearby opportunity detection only while actively testing; the foreground session stops after two hours.
          7. Test goals in this order: reservation plan, insurance document plan, benefit candidate, nearby pharmacy map search, stream rule.
          8. Do not use real banking or insurance submission until the corresponding authorized provider adapter is connected and live-tested.
          EOF

          tar -czf dist/life-agent-commercial-hardening-source.tar.gz \
            -C "$PROJECT_ROOT" \
            app/src app/build.gradle settings.gradle build.gradle gradle.properties 2>/dev/null || \
          tar -czf dist/life-agent-commercial-hardening-source.tar.gz \
            -C "$PROJECT_ROOT" app/src app/build.gradle settings.gradle build.gradle
          sha256sum dist/life-agent-commercial-hardening-source.tar.gz \
            > dist/life-agent-commercial-hardening-source.tar.gz.sha256
          cp -R runtime-evidence dist/runtime-evidence

      - name: Upload hardened commercialization candidate
        uses: actions/upload-artifact@v4
        with:
          name: life-agent-os-v3.2-hardening-beta
          path: dist/*
          if-no-files-found: error
          retention-days: 7
