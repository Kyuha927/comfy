name: Publish YuE2 Music OS v0.2 Alpha

on:
  push:
    branches:
      - yue2-music-os-v0.2-alpha-transport-20260915
    paths:
      - ".bootstrap/yue2-v0.2-parts/**"
      - ".github/workflows/yue2-v0.2-publish.yml"

permissions:
  contents: write

concurrency:
  group: yue2-v0-2-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA256: "9804b6b3aac5538b4115819f3622d01e28d4d8fd1f74c640a138e94c2e486d8a"
      SOURCE_ROOT: yue2-music-os-v0.2-alpha
      FINAL_BRANCH: yue2-music-os-v0.2-alpha-verified-20260915
      BASE_COMMIT: 39243c99a259fe43a7484d3bde2107ffe8286bf1
      EXPECTED_PARTS: "8"
    steps:
      - name: Check out transport branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reassemble and authenticate source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          from pathlib import Path

          part_dir = Path('.bootstrap/yue2-v0.2-parts')
          parts = sorted(part_dir.glob('part-*'), key=lambda path: path.name)
          expected_parts = int(os.environ['EXPECTED_PARTS'])
          if len(parts) != expected_parts:
              raise SystemExit(
                  f'expected {expected_parts} transport chunks, found {len(parts)}: '
                  f'{[path.name for path in parts]}'
              )

          decoded_parts: list[bytes] = []
          for path in parts:
              encoded = b''.join(path.read_bytes().split())
              missing_padding = (-len(encoded)) % 4
              if missing_padding:
                  encoded += b'=' * missing_padding
                  print(f'{path.name}: restored {missing_padding} omitted padding byte(s)')
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except Exception as exc:
                  raise SystemExit(
                      f'{path.name}: independent Base64 decode failed: '
                      f'{type(exc).__name__}: {exc}'
                  ) from exc
              decoded_parts.append(decoded)
              print(
                  f'{path.name}: encoded={len(encoded)} decoded={len(decoded)} '
                  f'sha256={hashlib.sha256(decoded).hexdigest()}'
              )

          archive = b''.join(decoded_parts)
          digest = hashlib.sha256(archive).hexdigest()
          expected = os.environ['SOURCE_SHA256']
          print(f'archive_bytes={len(archive)}')
          print(f'archive_sha256={digest}')
          if digest != expected:
              raise SystemExit(
                  f'archive checksum mismatch: expected {expected}, got {digest}'
              )
          Path('/tmp/yue2-music-os-v0.2-alpha.tar.xz').write_bytes(archive)
          PY
          mkdir -p /tmp/yue2-source
          tar -xJf /tmp/yue2-music-os-v0.2-alpha.tar.xz -C /tmp/yue2-source
          test -f "/tmp/yue2-source/${SOURCE_ROOT}/RELEASE_STATUS.json"
          test -f "/tmp/yue2-source/${SOURCE_ROOT}/SHA256SUMS.txt"
          test -x "/tmp/yue2-source/${SOURCE_ROOT}/scripts/release_check.sh"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install controller and test dependencies
        working-directory: /tmp/yue2-source/${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Run strict release gate
        working-directory: /tmp/yue2-source/${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release_check.sh "${RUNNER_TEMP}/yue2-release-check"

      - name: Publish immutable clean branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/${FINAL_BRANCH}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing to overwrite it." >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "${BASE_COMMIT}"
          git switch -c "${FINAL_BRANCH}"
          mkdir -p releases/yue2-music-os/v0.2-alpha .github/workflows
          cp -a "/tmp/yue2-source/${SOURCE_ROOT}/." releases/yue2-music-os/v0.2-alpha/
          cp releases/yue2-music-os/v0.2-alpha/ci/yue2-music-os-v0.2-ci.yml .github/workflows/yue2-music-os-v0.2-ci.yml
          git add releases/yue2-music-os/v0.2-alpha .github/workflows/yue2-music-os-v0.2-ci.yml
          git commit -m "feat: add verified YuE2 Music OS v0.2 alpha"
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"
