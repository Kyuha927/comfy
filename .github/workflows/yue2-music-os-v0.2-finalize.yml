name: Finalize YuE2 Music OS v0.2 Alpha

on:
  push:
    branches:
      - yue2-music-os-composition-router-v0.2-alpha-20260915
    paths:
      - ".github/workflows/yue2-music-os-v0.2-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yue2-music-os-v0.2-finalize-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DIR: releases/yue2-music-os/v0.2-alpha
  SOURCE_DATE_EPOCH: "1789430400"

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore exact verified source
        env:
          BOOTSTRAP_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-63e0-81f5-bb55-2046daa5424c/raw?se=2026-09-15T08%3A32%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=a73a4d52-0ba4-568e-aafb-8bf092d06c1c&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T01%3A54%3A13Z&ske=2026-09-16T01%3A54%3A13Z&sks=b&skv=2026-02-06&sig=DyBlUtqOvWJ3v2Uq20bzrrM183pBpluFuHaoIqd7kuU%3D'
          BOOTSTRAP_SHA256: '2788ea2e48d80d008761ca7edadf226dee2278dfcf03284dda79a608d53008d1'
        run: |
          set -euo pipefail
          if [[ -f "$RELEASE_DIR/src/yue2_music_os/production.py" ]]; then
            echo "Complete source tree already present."
            (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS.txt)
            exit 0
          fi
          test -n "$BOOTSTRAP_URL"
          archive=/tmp/yue2-music-os-v0.2-alpha-bootstrap.zip
          extract=/tmp/yue2-music-os-v0.2-alpha-bootstrap
          rm -rf "$archive" "$extract"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$BOOTSTRAP_URL" -o "$archive"
          echo "$BOOTSTRAP_SHA256  $archive" | sha256sum -c -
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          source_dir="$extract/yue2-music-os-v0.2-alpha"
          test -f "$source_dir/src/yue2_music_os/production.py"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$(dirname "$RELEASE_DIR")"
          cp -a "$source_dir" "$RELEASE_DIR"
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS.txt)

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install and verify source
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip check
          sha256sum -c SHA256SUMS.txt
          python -m compileall -q src tests
          node --check src/yue2_music_os/static/app.js
          bash -n scripts/*.sh

      - name: Run coverage gate
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p validation
          pytest \
            --cov=yue2_music_os \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:validation/ci-coverage.json \
            --cov-fail-under=75 \
            --junitxml=validation/ci-junit.xml \
            | tee validation/ci-pytest.txt

      - name: Run HTTP composition-to-render smoke
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail
          ./scripts/smoke.sh | tee validation/ci-smoke.txt

      - name: Build verified distribution
        working-directory: ${{ env.RELEASE_DIR }}
        env:
          TESTED_SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf dist build src/*.egg-info
          mkdir -p dist validation
          python -m pip wheel . --no-deps -w dist | tee validation/ci-wheel-build.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          root = Path('.')
          dist = root / 'dist'
          archive = dist / 'yue2-music-os-v0.2-alpha-source.zip'
          excluded_top = {'dist', 'validation', '.venv', 'build', 'var', 'runtime', '.pytest_cache'}
          source_files = []
          for path in sorted(root.rglob('*'), key=lambda value: value.as_posix()):
              if not path.is_file() or path.is_symlink():
                  continue
              rel = path.relative_to(root)
              if rel.parts and rel.parts[0] in excluded_top:
                  continue
              if '__pycache__' in rel.parts or path.suffix in {'.pyc', '.pyo'}:
                  continue
              source_files.append((path, rel))
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for path, rel in source_files:
                  info = zipfile.ZipInfo(
                      (Path('yue2-music-os-v0.2-alpha') / rel).as_posix(),
                      date_time=(2026, 9, 15, 0, 0, 0),
                  )
                  info.external_attr = (stat.S_IMODE(path.stat().st_mode) & 0xFFFF) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  output.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          wheel = next(dist.glob('yue2_music_os-0.2.0a1-*.whl'))
          with zipfile.ZipFile(wheel) as package:
              members = set(package.namelist())
          required = {
              'yue2_music_os/production.py',
              'yue2_music_os/static/app.js',
              'yue2_music_os/static/index.html',
              'yue2_music_os/static/styles.css',
          }
          missing = sorted(required - members)
          if missing:
              raise SystemExit('wheel missing required members: ' + ', '.join(missing))

          def artifact(path: Path) -> dict[str, object]:
              return {
                  'name': path.name,
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          artifacts = [artifact(archive), artifact(wheel)]
          (dist / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['name']}\n" for item in artifacts),
              encoding='utf-8',
          )

          coverage = json.loads((root / 'validation/ci-coverage.json').read_text(encoding='utf-8'))
          junit = ET.parse(root / 'validation/ci-junit.xml').getroot()
          tests = int(junit.attrib.get('tests', 0))
          failures = int(junit.attrib.get('failures', 0))
          errors = int(junit.attrib.get('errors', 0))
          if (tests, failures, errors) != (48, 0, 0):
              raise SystemExit(f'unexpected test result: tests={tests} failures={failures} errors={errors}')
          coverage_percent = round(float(coverage['totals']['percent_covered']), 2)
          if coverage_percent < 75:
              raise SystemExit(f'coverage below gate: {coverage_percent}')

          static = json.loads((root / 'validation/static-render.json').read_text(encoding='utf-8'))
          wheel_report = {
              **artifacts[1],
              'wheel': wheel.name,
              'member_count': len(members),
              'required_members': 'PASS',
          }
          report = {
              'release': 'yue2-music-os-v0.2-alpha',
              'target_branch': 'yue2-music-os-composition-router-v0.2-alpha-20260915',
              'tested_source_commit': os.environ['TESTED_SOURCE_COMMIT'],
              'ci_run_id': int(os.environ['CI_RUN_ID']),
              'ci_run_attempt': int(os.environ['CI_RUN_ATTEMPT']),
              'verdict': 'PASS_CONTROLLER_AND_ROUTER_REAL_MODELS_PENDING',
              'tests': {
                  'passed': tests,
                  'failed': failures,
                  'errors': errors,
                  'branch_coverage_percent': coverage_percent,
                  'minimum_percent': 75,
              },
              'checks': {
                  'source_checksums': 'PASS',
                  'python_3_12_install': 'PASS',
                  'python_compileall': 'PASS',
                  'javascript_syntax': 'PASS',
                  'bash_syntax': 'PASS',
                  'http_smoke_generate_rank_production': 'PASS',
                  'wheel_required_members': 'PASS',
                  'desktop_static_render_local_evidence': 'PASS',
                  'mobile_static_render_local_evidence': 'PASS',
              },
              'static_render': static,
              'wheel': wheel_report,
              'artifacts': artifacts,
              'not_run': [
                  'real YuE2 GPU inference',
                  'real SheetSage2 transcription',
                  'live Flow/Lyria call',
                  'live Suno call',
                  'live Eleven Music call',
              ],
          }
          (root / 'validation/wheel-report.json').write_text(
              json.dumps(wheel_report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'validation/dist-artifacts.json').write_text(
              json.dumps(artifacts, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'validation/VALIDATION_REPORT.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'validation/CI_ARTIFACT_BUILD.json').write_text(
              json.dumps({
                  'tested_source_commit': os.environ['TESTED_SOURCE_COMMIT'],
                  'ci_run_id': int(os.environ['CI_RUN_ID']),
                  'ci_run_attempt': int(os.environ['CI_RUN_ATTEMPT']),
                  'source_date_epoch': int(os.environ['SOURCE_DATE_EPOCH']),
                  'artifacts': artifacts,
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish verified source and artifacts
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR/.coverage" "$RELEASE_DIR/.pytest_cache" \
            "$RELEASE_DIR/build" "$RELEASE_DIR/src/"*.egg-info
          find "$RELEASE_DIR" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RELEASE_DIR" -type f -name '*.py[co]' -delete
          rm -rf .bootstrap
          rm -f .github/workflows/yue2-music-os-v0.2-ci.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/yue2-music-os-v0.2-finalize.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          path.write_text(
              '\n'.join(
                  "          BOOTSTRAP_URL: ''"
                  if line.lstrip().startswith('BOOTSTRAP_URL:')
                  else line
                  for line in lines
              ) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f "$RELEASE_DIR/dist"
          git commit -m "chore: publish verified YuE2 Music OS v0.2 artifacts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
