name: Verify Production Skill OS

on:
  push:
    paths:
      - 'production-skill-os/**'
      - '.github/workflows/production-skill-os.yml'
  pull_request:
    paths:
      - 'production-skill-os/**'
      - '.github/workflows/production-skill-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog
        run: python production-skill-os/router/skill_router.py validate
      - name: Run standard-library regression suite
        run: python -m unittest discover -s production-skill-os/tests -v
