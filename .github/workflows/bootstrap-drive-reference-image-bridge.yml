name: Bootstrap Drive Reference Image Bridge

on:
  push:
    branches:
      - drive-reference-image-bridge-native-chat-20260914
    paths:
      - '.github/bootstrap/**'
      - '.github/workflows/bootstrap-drive-reference-image-bridge.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transport and expand source
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR='.github/bootstrap/chunks'
          MANIFEST='.github/bootstrap/drive-reference-image-bridge-source.manifest.sha256'
          COMBINED="$RUNNER_TEMP/drive-reference-image-bridge-source.b64"
          ARCHIVE="$RUNNER_TEMP/drive-reference-image-bridge-source.tar.gz"
          CHUNK_SUMS="$RUNNER_TEMP/drive-reference-image-bridge-chunks.sha256"

          test "$(find "$CHUNK_DIR" -maxdepth 1 -type f -name 'drive-ref-*.b64' | wc -l | tr -d ' ')" = '8'
          cat > "$CHUNK_SUMS" <<'EOF'
          84f636dbd5184e7b655a8bcfd7eee21351f310a264a6ae597ba319c17a94a892  .github/bootstrap/chunks/drive-ref-00.b64
          f89703656968651783ca8ad96c5376f2a0d25ccfcebe2ebdbe09c46ffbdeed39  .github/bootstrap/chunks/drive-ref-01.b64
          449edde5207f5d67518fa86b6fbef9b1bfed58501f532faef2b6f30748851853  .github/bootstrap/chunks/drive-ref-02.b64
          36474519907b267f8f10aaab15bf8ed6b81be2362976c0f6dd87b9ee514ffff4  .github/bootstrap/chunks/drive-ref-03.b64
          e8420e17af1390a2423300234f45c75c47c6594d6b69b5259020c8c0e8ca8ef1  .github/bootstrap/chunks/drive-ref-04.b64
          e6d223deeedb4fa31409a7b40fcab474fecbfbe0e755edd425d3f5c6edef837d  .github/bootstrap/chunks/drive-ref-05.b64
          d8727b32807b5c7ff0ecdb0e43b6d0abbc07c24f4e7c42198971a23e00d7eb06  .github/bootstrap/chunks/drive-ref-06.b64
          5bc11ce6f24d5d3863c63fbd7868eeafca1e59b306ab6dd3474efc9af385a1db  .github/bootstrap/chunks/drive-ref-07.b64
          EOF
          sed -i 's/^          //' "$CHUNK_SUMS"
          sha256sum --check --strict "$CHUNK_SUMS"

          cat "$CHUNK_DIR"/drive-ref-*.b64 > "$COMBINED"
          echo "1f4333face6c7da4d85d9d92c3968694321fea546742edea436d2f00d920e45d  $COMBINED" | sha256sum --check --strict
          echo "b1bd1f413c7808899750870224675026cbf4efde207fa0da8f47e1266caceb88  $MANIFEST" | sha256sum --check --strict
          base64 --decode "$COMBINED" > "$ARCHIVE"
          echo "a88ce8363e59124a85c91aa0c330afde2421711f18a8f4413590f1efbc4151b3  $ARCHIVE" | sha256sum --check --strict
          gzip --test "$ARCHIVE"

          python - "$ARCHIVE" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  parts = pathlib.PurePosixPath(member.name).parts
                  if member.name.startswith('/') or '..' in parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links are forbidden: {member.name}')
          PY

          tar -xzf "$ARCHIVE" -C .
          test "$(wc -l < "$MANIFEST" | tr -d ' ')" = '27'
          sha256sum --check --strict "$MANIFEST"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pillow pytest jsonschema
      - name: Run product gates before commit
        shell: bash
        run: |
          set -euo pipefail
          python plugins/drive-reference-image-bridge/scripts/validate_plugin.py --repo-root .
          python -m pytest -q plugins/drive-reference-image-bridge/tests
          python plugins/drive-reference-image-bridge/skills/drive-reference-image/scripts/validate_receipt.py plugins/drive-reference-image-bridge/validation/canonical-source-receipt.json
          python -m compileall -q plugins/drive-reference-image-bridge
          rm -rf '.github/bootstrap' '.github/workflows/bootstrap-drive-reference-image-bridge.yml'
      - name: Commit verified production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat: add native Chat Drive reference image plugin'
          git push origin "HEAD:${GITHUB_REF_NAME}"
