name: Apply LIN 3D capability gate v2

on:
  push:
    branches:
      - candidate/tool-capability-lin3d-gate-v2-20260914
    paths:
      - '.capability-bootstrap/**'
      - '.github/workflows/capability-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capability-bootstrap-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated current-base candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reconcile authorities, validate, test, and commit final gate
        shell: bash
        run: bash .capability-bootstrap/apply.sh
