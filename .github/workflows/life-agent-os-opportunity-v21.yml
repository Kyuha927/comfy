name: Build Life Agent OS v2.1 Opportunity APK

on:
  push:
    branches:
      - life-agent-os-opportunity-v21-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-opportunity-os:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: life-agent-os-opportunity-v21-20260911

      - name: Restore Agent OS v2 and apply Opportunity Engine
        shell: bash
        run: |
          set -euo pipefail
          cat life-agent-build/source.tar.xz.b64.part* | base64 --decode > /tmp/life-agent-base.tar.xz
          echo '29919c8d8f0f4b535d1c1a05370e22d464ef7bdc1725730da21add0d1ac5f06b  /tmp/life-agent-base.tar.xz' | sha256sum -c -
          rm -rf /tmp/life-agent-src
          mkdir -p /tmp/life-agent-src
          tar -xJf /tmp/life-agent-base.tar.xz -C /tmp/life-agent-src
          ROOT=/tmp/life-agent-src/life-agent-unified-v2
          test -f "$ROOT/app/build.gradle"

          if [ -f life-agent-build/apply-patches.sh ]; then
            bash life-agent-build/apply-patches.sh "$ROOT"
          fi

          cat life-agent-os-v2/patch.tar.xz.b64.part* | base64 --decode > /tmp/life-agent-os-v2-patch.tar.xz
          echo '20e0f1b2200d3dd537451b0c6ced4ed467191ba409fff0b7ae6b83ef74742b88  /tmp/life-agent-os-v2-patch.tar.xz' | sha256sum -c -
          tar -xJf /tmp/life-agent-os-v2-patch.tar.xz -C "$ROOT"

          if [ -f life-agent-os-v2/apply-build-fixes.sh ]; then
            bash life-agent-os-v2/apply-build-fixes.sh "$ROOT"
          fi

          cat life-agent-opportunity-patch/patch.b64.part* | base64 --decode > /tmp/opportunity-v21.patch.xz
          echo '3d3f90b4083e8658be2bdf5f5a1fb09895349599d6154142e387ba1e830ad005  /tmp/opportunity-v21.patch.xz' | sha256sum -c -
          xz -dc /tmp/opportunity-v21.patch.xz > /tmp/opportunity-v21.patch
          cd "$ROOT"
          patch -p1 --forward --batch < /tmp/opportunity-v21.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Opportunity Engine and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/life-agent-src/life-agent-unified-v2
          JAVA="$ROOT/app/src/main/java/com/lifeagent/unified"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          grep -q "applicationId 'com.lifeagent.unified'" "$ROOT/app/build.gradle"
          grep -q "versionCode 210" "$ROOT/app/build.gradle"
          grep -q "versionName '2.1.0-opportunity-alpha'" "$ROOT/app/build.gradle"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$MANIFEST"
          grep -q 'android:foregroundServiceType="location"' "$MANIFEST"
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          grep -q 'OpportunityActivity' "$MANIFEST"
          grep -q 'OpportunityLocationService' "$MANIFEST"
          test -f "$JAVA/OpportunityEngine.java"
          test -f "$JAVA/OpportunityActivity.java"
          test -f "$JAVA/OpportunityLocationService.java"
          test -f "$JAVA/OpportunityNotifier.java"
          grep -q 'opportunity.discovery' "$JAVA/AgentOsCore.java"
          grep -q 'benefit.application' "$JAVA/AgentOsCore.java"
          grep -q 'LOCATION_CHANGED' "$JAVA/AgentOsCore.java"
          grep -q 'LOCAL_CONTEXT' "$JAVA/AgentOsCore.java"
          grep -q 'OFFICIAL_API' "$JAVA/AgentOsCore.java"
          grep -q 'raw_location_included' "$JAVA/OpportunityEngine.java"
          grep -q 'preauthorized' "$JAVA/OpportunityEngine.java"
          grep -q 'latestLocation' "$JAVA/OpportunityEngine.java"
          grep -q 'AndroidKeyStore' "$JAVA/SecureStore.java"
          grep -q 'usesCleartextTraffic="false"' "$MANIFEST"
          ! grep -R -E '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,})' "$ROOT" --exclude='*.md'

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('/tmp/life-agent-src/life-agent-unified-v2')
          ET.parse(root / 'app/src/main/AndroidManifest.xml')
          java = root / 'app/src/main/java/com/lifeagent/unified'
          required = {
              'OpportunityEngine.java': ['TrackingMode', 'confirmedFacts', 'prepareApplication', 'backendDiscoveryPayload'],
              'OpportunityActivity.java': ['이동 중 탐색', '자격 확인·신청 준비', '자동 신청 정책'],
              'OpportunityLocationService.java': ['FOREGROUND_SERVICE_TYPE_LOCATION', 'START_STICKY'],
              'AgentOsCore.java': ['opportunity.discovery', 'benefit.application', 'official_application_receipt'],
          }
          for name, needles in required.items():
              text = (java / name).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (name, needle)
          print('opportunity static contract PASS')
          PY

      - name: Assemble single installable APK
        id: assemble
        shell: bash
        working-directory: /tmp/life-agent-src/life-agent-unified-v2
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/life-agent-opportunity-gradle.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare compile diagnostics
        if: always() && steps.assemble.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p failure-assets
          {
            echo 'LIFE_AGENT_OS_V21_OPPORTUNITY_BUILD_FAILURE'
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo
            grep -n -E '(^|[[:space:]])(error:|FAILURE:|What went wrong|Execution failed|Caused by:|cannot find symbol|incompatible types|package .* does not exist)' /tmp/life-agent-opportunity-gradle.log || true
            echo
            echo '--- FINAL 360 LINES ---'
            tail -n 360 /tmp/life-agent-opportunity-gradle.log
          } > failure-assets/BUILD_FAILURE.log

      - name: Upload compile diagnostics
        if: always() && steps.assemble.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: life-agent-os-v21-opportunity-build-failure
          path: failure-assets/BUILD_FAILURE.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after captured compile failure
        if: steps.assemble.outputs.status != '0'
        run: exit 1

      - name: Verify package, signature, alignment and manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/life-agent-src/life-agent-unified-v2
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          rm -rf release-assets
          mkdir -p release-assets
          cp "$APK" release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk > release-assets/zipalign.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk | tee release-assets/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk | tee release-assets/apk-badging.txt
          grep -q "package: name='com.lifeagent.unified'" release-assets/apk-badging.txt
          grep -q "versionCode='210'" release-assets/apk-badging.txt
          grep -q "versionName='2.1.0-opportunity-alpha'" release-assets/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk | tee release-assets/apk-permissions.txt
          grep -q 'ACCESS_COARSE_LOCATION' release-assets/apk-permissions.txt
          grep -q 'FOREGROUND_SERVICE_LOCATION' release-assets/apk-permissions.txt
          ! grep -q 'ACCESS_BACKGROUND_LOCATION' release-assets/apk-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk AndroidManifest.xml > release-assets/manifest-tree.txt
          grep -q 'OpportunityActivity' release-assets/manifest-tree.txt
          grep -q 'OpportunityLocationService' release-assets/manifest-tree.txt
          unzip -t release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk | tee release-assets/unzip-test.txt
          sha256sum release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk > release-assets/Life-Agent-OS-v2.1-opportunity-alpha.apk.sha256

          rm -rf "$ROOT/app/build" "$ROOT/.gradle"
          tar -C /tmp/life-agent-src -czf release-assets/life-agent-os-v2.1-opportunity-source.tar.gz life-agent-unified-v2
          sha256sum release-assets/life-agent-os-v2.1-opportunity-source.tar.gz > release-assets/life-agent-os-v2.1-opportunity-source.tar.gz.sha256
          {
            echo 'Life Agent OS v2.1 Opportunity build'
            echo 'package=com.lifeagent.unified'
            echo 'version=2.1.0-opportunity-alpha'
            echo 'versionCode=210'
            echo 'minSdk=30'
            echo 'targetSdk=35'
            echo 'architecture=ContextEngine->OpportunityEngine->SkillRegistry->PolicyKernel->ExecutorRouter->PersistentTaskGraph'
            echo 'location=foreground-user-started,coarse-default,latest-only-encrypted,no-background-permission'
            echo 'application=discover->eligibility->documents->prefill->confirmation/auth->submit->receipt-verification'
            echo 'automatic_submit=verified-official-adapter+per-program-preauthorization+no-auth-only'
            echo 'status=BUILD_AND_VERIFICATION_PASS'
          } > release-assets/OPPORTUNITY_BUILD_REPORT.txt

      - name: Upload verified APK and source
        uses: actions/upload-artifact@v4
        with:
          name: life-agent-os-v2.1-opportunity-alpha
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
