name: Recover and Publish YuE2 Music OS v0.1 Alpha

on:
  push:
    branches:
      - yue2-music-os-v0.1-recovery-transport-20260915

permissions:
  contents: write

concurrency:
  group: yue2-v0-1-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_ARCHIVE_SHA256: 328d5be5cf6ba3b04e5e8140e2946c9233f96419729bf8c7d4c372d114b92963
      SOURCE_ROOT: /tmp/yue2-source/yue2_music_os/releases/yue2-music-os/v0.1-alpha
      FINAL_BRANCH: yue2-music-os-v0.1-alpha-recovered-20260915
      BASE_COMMIT: 39243c99a259fe43a7484d3bde2107ffe8286bf1
    steps:
      - name: Check out recovery transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reassemble, authenticate, and extract source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os

          parts = sorted(Path('.bootstrap').glob('yue2-music-os.tar.xz.b64.part-*'), key=lambda p: p.name)
          if len(parts) != 4:
              raise SystemExit(f'expected 4 transport files, found {len(parts)}: {[p.name for p in parts]}')
          encoded = b''.join(p.read_bytes() for p in parts)
          compact = b''.join(encoded.split())
          try:
              archive = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit(f'base64 decode failed: {type(exc).__name__}: {exc}') from exc
          digest = hashlib.sha256(archive).hexdigest()
          expected = os.environ['EXPECTED_ARCHIVE_SHA256']
          print(f'parts={[p.name for p in parts]}')
          print(f'encoded_bytes={len(encoded)} compact_bytes={len(compact)} archive_bytes={len(archive)}')
          print(f'archive_sha256={digest}')
          if digest != expected:
              raise SystemExit(f'archive checksum mismatch: expected {expected}, got {digest}')
          Path('/tmp/yue2-music-os.tar.xz').write_bytes(archive)
          PY
          mkdir -p /tmp/yue2-source
          tar -xJf /tmp/yue2-music-os.tar.xz -C /tmp/yue2-source
          test -f "${SOURCE_ROOT}/pyproject.toml"
          test -f "${SOURCE_ROOT}/RELEASE_STATUS.json"
          test -f "${SOURCE_ROOT}/SHA256SUMS.txt"
          test -d "${SOURCE_ROOT}/src/yue2_music_os"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify recovered source
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          node --check src/yue2_music_os/static/app.js
          bash -n scripts/*.sh
          pytest --cov=yue2_music_os --cov-branch --cov-report=term-missing --cov-fail-under=75
          ./scripts/smoke.sh
          rm -rf /tmp/yue2-wheel
          mkdir -p /tmp/yue2-wheel
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/yue2-wheel
          test -n "$(find /tmp/yue2-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          sha256sum -c SHA256SUMS.txt

      - name: Publish clean verified branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/${FINAL_BRANCH}" >/dev/null 2>&1; then
            echo "${FINAL_BRANCH} already exists; refusing to overwrite it" >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "${BASE_COMMIT}"
          git switch -c "${FINAL_BRANCH}"
          mkdir -p releases/yue2-music-os/v0.1-alpha
          cp -a "${SOURCE_ROOT}/." releases/yue2-music-os/v0.1-alpha/
          git add releases/yue2-music-os/v0.1-alpha
          test -n "$(git status --porcelain)"
          git commit -m 'feat: recover verified YuE2 Music OS v0.1 alpha'
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"
